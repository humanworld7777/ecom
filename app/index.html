<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAPP Store</title>
<style>
  :root {
    --bg: #fffaf5; --card: #ffffff; --text: #2b2320; --muted: #7a6b62;
    --line: #eee3da; --accent: #d9480f; --accent-text: #ffffff;
    --ok: #2b8a3e; --err: #c92a2a; --warn: #b36200;
    --shadow: 0 8px 28px rgba(120, 70, 30, .10);
    --hero-a: #fff0e0; --hero-b: #ffe0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120f; --card: #211a16; --text: #f4ebe4; --muted: #b5a59a;
      --line: #3a2e27; --accent: #ff8a5b; --accent-text: #1b110c;
      --ok: #69db7c; --err: #ff8787; --warn: #ffc078;
      --shadow: 0 8px 28px rgba(0, 0, 0, .35);
      --hero-a: #2b1d14; --hero-b: #2d1923;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 0 0 1rem; }
  h2 { font-size: 1.15rem; margin: 0 0 .75rem; }
  h3 { font-size: 1rem; margin: .5rem 0 .25rem; }
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.5rem;
    padding: .75rem 1.25rem; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--text); }
  #nav { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem 1rem; margin-left: auto; }
  #nav a { text-decoration: none; color: var(--muted); padding: .25rem 0; }
  #nav a.active { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); }
  #nav .who { color: var(--muted); font-size: .85rem; }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.25rem; margin-bottom: 1rem;
  }
  .narrow { max-width: 420px; margin: 2rem auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .product { display: flex; flex-direction: column; gap: .15rem; margin: 0; }
  .product .btn { margin-top: auto; }
  .tile {
    height: 110px; border-radius: 8px; display: grid; place-items: center;
    font-size: 2.5rem; font-weight: 700; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .price { font-weight: 700; margin: 0; }
  .btn {
    display: inline-block; font: inherit; cursor: pointer; text-decoration: none;
    padding: .5rem 1rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.small { padding: .2rem .6rem; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .grow { flex: 1 1 180px; }
  .qty { display: flex; align-items: center; gap: .5rem; }
  .amount { min-width: 5rem; text-align: right; font-weight: 600; }
  .total { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 1.1rem; font-weight: 700; }
  .badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: .1rem .55rem; border-radius: 999px; background: var(--line); }
  .s-paid, .s-delivered { background: rgba(23,114,69,.16); color: var(--ok); }
  .s-shipped, .s-in_transit, .s-out_for_delivery, .s-processing { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .s-pending_payment, .s-awaiting_address { background: rgba(161,92,7,.16); color: var(--warn); }
  .s-cancelled { background: rgba(180,35,24,.16); color: var(--err); }
  .order-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin-bottom: .5rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  .form { display: grid; gap: .75rem; }
  .field { display: grid; gap: .25rem; font-size: .9rem; }
  input, select {
    font: inherit; padding: .5rem .65rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%;
  }
  .inline-form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .inline-form input, .inline-form select { width: auto; flex: 1 1 140px; }
  .tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .tab { padding: .5rem 0; text-decoration: none; color: var(--muted); }
  .tab.active { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); }
  .stepper { display: flex; margin: 1rem 0 1.5rem; padding: 0; list-style: none; }
  .stepper li { flex: 1; text-align: center; font-size: .75rem; color: var(--muted); position: relative; }
  .stepper li::before {
    content: ""; display: block; width: 14px; height: 14px; border-radius: 50%;
    margin: 0 auto .35rem; background: var(--line); position: relative; z-index: 1;
  }
  .stepper li::after {
    content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: var(--line);
  }
  .stepper li:first-child::after { display: none; }
  .stepper li.done { color: var(--text); }
  .stepper li.done::before, .stepper li.done::after { background: var(--accent); }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { padding: .5rem 0 .5rem 1rem; border-left: 2px solid var(--line); margin-left: .35rem; }
  .items { margin: .25rem 0; padding-left: 1.1rem; color: var(--muted); font-size: .9rem; }
  .cols { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  #toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; z-index: 10; max-width: calc(100vw - 2rem); }
  .toast { padding: .65rem 1rem; border-radius: 8px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .toast.ok { border-left: 4px solid var(--ok); }
  .toast.error { border-left: 4px solid var(--err); }
  .photo { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background: var(--line); display: block; }
  .thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line); }
  .tile.thumb { font-size: 1.4rem; }
  .product select { margin: .4rem 0; }
  .admin-product { display: grid; gap: .5rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
  .admin-product:last-child { border-bottom: 0; }
  .inline-form input[type="file"] { flex: 2 1 200px; }
  .plain { color: inherit; text-decoration: none; }
  .stars { color: #f5a524; letter-spacing: 1px; }
  .stars .off { color: var(--line); }
  .rating { margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .controls input[type="search"] { flex: 2 1 220px; width: auto; }
  .controls select { flex: 1 1 160px; width: auto; }
  .check { display: flex; gap: .4rem; align-items: center; font-size: .9rem; }
  .check input { width: auto; }
  .detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; align-items: start; }
  .photo.big { height: auto; max-height: 480px; aspect-ratio: 1 / 1; cursor: zoom-in; }
  .tile.big { height: 320px; font-size: 5rem; }
  .thumbs, .photo-bar { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
  .thumb.pick { cursor: pointer; border: 2px solid transparent; }
  .thumb.pick.on { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
  .chip { font: inherit; padding: .35rem .85rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .chip:disabled { opacity: .45; text-decoration: line-through; cursor: not-allowed; }
  .desc { white-space: pre-line; }
  .summary { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; }
  .big-score { font-size: 2.4rem; font-weight: 700; line-height: 1; }
  .bars { flex: 1 1 220px; display: grid; gap: .25rem; }
  .bar-row { display: grid; grid-template-columns: 2.4rem 1fr 2rem; gap: .5rem; align-items: center; font-size: .85rem; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; background: #f5a524; }
  .star-picker { display: flex; gap: .1rem; }
  .star-btn { font-size: 1.7rem; background: none; border: 0; cursor: pointer; color: var(--line); padding: 0 .1rem; }
  .star-btn.on { color: #f5a524; }
  textarea { font: inherit; padding: .5rem .65rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; resize: vertical; }
  .review { padding: .75rem 0; border-bottom: 1px solid var(--line); }
  .review:last-child { border-bottom: 0; }
  .review p { margin: .25rem 0 0; white-space: pre-line; }
  .photo-item { display: grid; gap: .25rem; justify-items: center; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.88); display: grid; place-items: center; overflow: hidden; }
  .lb-img { max-width: 92vw; max-height: 84vh; cursor: zoom-in; transition: transform .15s; }
  .lb-img.zoomed { transform: scale(2.2); cursor: zoom-out; }
  .lb-btn { position: absolute; background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 1.6rem; cursor: pointer; }
  .lb-close { top: 1rem; right: 1rem; }
  .lb-prev { left: 1rem; top: 50%; }
  .lb-next { right: 1rem; top: 50%; }
  .lb-count { position: absolute; bottom: 1rem; color: #fff; font-size: .9rem; }
  /* ---- ZAPP Store look ---- */
  body { font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.8rem; letter-spacing: -.01em; }
  .card { border-radius: 16px; box-shadow: var(--shadow); }
  .btn { border-radius: 10px; font-weight: 600; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn.primary:hover:not(:disabled) { box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn.big { padding: .75rem 1.4rem; font-size: 1.05rem; border-radius: 12px; }
  .brand { font-weight: 800; font-size: 1.3rem; letter-spacing: .02em; display: flex; align-items: center; gap: .35rem; }
  .brand .bolt { color: var(--accent); }
  .top { background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(8px); }
  .product { transition: transform .15s ease; }
  .product:hover { transform: translateY(-3px); }
  .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; align-items: center; padding: 2.5rem 2rem; margin-bottom: 1.5rem; border-radius: 24px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding: 1.75rem 1.25rem; } .hero-art { display: none; } }
  .eyebrow { margin: 0 0 .25rem; color: var(--accent); font-weight: 700; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; margin: 0 0 .75rem; }
  .lead { font-size: 1.1rem; color: var(--muted); margin: 0 0 1.25rem; max-width: 34rem; }
  .hero-search { display: flex; gap: .5rem; margin-bottom: 1rem; max-width: 32rem; }
  .hero-search input { flex: 1; border-radius: 12px; padding: .75rem 1rem; font-size: 1rem; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; }
  .hero-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
  .art-tile { aspect-ratio: 1; display: grid; place-items: center; font-size: 2.4rem; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
  .art-tile:nth-child(odd) { transform: rotate(-4deg); }
  .art-tile:nth-child(even) { transform: rotate(4deg) translateY(10px); }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin: 2rem 0 1rem; }
  .section-head h2 { font-size: 1.4rem; margin: 0; }
  .section-head p { margin: 0; }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
  .cat-tile { display: grid; gap: .15rem; justify-items: start; padding: 1.1rem; border-radius: 18px; text-decoration: none; color: var(--text); background: hsl(var(--h) 85% 94%); transition: transform .15s ease, box-shadow .15s ease; }
  @media (prefers-color-scheme: dark) { .cat-tile { background: hsl(var(--h) 22% 18%); } }
  .cat-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .cat-icon { font-size: 2rem; line-height: 1; margin-bottom: .35rem; }
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 2.5rem; }
  .feature { padding: 1.1rem 1.25rem; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); }
  .feature .emoji { font-size: 1.6rem; }
  .feature h3 { margin: .35rem 0 .25rem; }
  .feature p { margin: 0; }
  .nudge { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; padding: .85rem 1.1rem; margin-bottom: 1.5rem; border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .cat-chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .cat-chip { padding: .35rem .9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; font-size: .9rem; }
  .cat-chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .page-head { margin-bottom: 1rem; }
  .page-head h1 { margin-bottom: .25rem; }
  .page-head p { margin: 0; }
  .crumbs { margin: 0 0 .75rem; font-size: .9rem; }
  .foot { text-align: center; padding: 2rem 1rem 3rem; color: var(--muted); font-size: .9rem; }
  .foot p { margin: 0; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/home"><span class="bolt" aria-hidden="true">⚡</span><span id="brand-name">ZAPP Store</span></a>
  <nav id="nav" aria-label="Main"></nav>
</header>
<main id="view" aria-live="polite"></main>
<div id="toasts"></div>
<footer class="foot" id="foot"><p>⚡ ZAPP Store · Made with care · Secure checkout powered by Stripe</p></footer>

<script>
"use strict";

// The name of the shop. Change it here and it changes everywhere on the page.
const STORE_NAME = "ZAPP Store";

// Must match the STRIPE_CURRENCY setting of the server (default usd).
const CURRENCY = "USD";

const money = (n) =>
  new Intl.NumberFormat(undefined, { style: "currency", currency: CURRENCY }).format(n);

const LABELS = {
  pending_payment: "Awaiting payment",
  paid: "Paid",
  shipped: "Shipped",
  delivered: "Delivered",
  cancelled: "Cancelled",
  awaiting_address: "Needs address",
  processing: "Processing",
  in_transit: "In transit",
  out_for_delivery: "Out for delivery",
  order_placed: "Order placed",
};
const label = (s) => LABELS[s] || s;
const badge = (s) => h("span", { class: "badge s-" + s }, label(s));
const when = (iso) => (iso ? new Date(iso).toLocaleString() : "");

const state = {
  token: localStorage.getItem("token"),
  me: null,
  cartCount: 0,
  poll: 0,
  adminFilter: "",
  categories: [],
};

const $view = document.getElementById("view");
const $nav = document.getElementById("nav");

// Replaces the page content. Lists are flattened and null/false are skipped,
// because the browser would print them as text.
function show(...nodes) {
  $view.replaceChildren(...nodes.flat().filter((n) => n != null && n !== false));
}

// ---------- small helpers ----------
// Builds an element. Text is always added as text, never as HTML.
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") el.className = value;
    else if (key.startsWith("on") && typeof value === "function") {
      el.addEventListener(key.slice(2), value);
    } else if (value === true) el.setAttribute(key, "");
    else if (value !== false && value != null) el.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return el;
}

function toast(message, kind = "info") {
  const el = h("div", { class: "toast " + kind, role: "status" }, message);
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), 4500);
}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function safeUrl(url) {
  return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
}

function errorText(data, status) {
  const detail = data && data.detail;
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    return detail
      .map((d) => (d.loc ? d.loc[d.loc.length - 1] + ": " : "") + d.msg)
      .join("; ");
  }
  return "Something went wrong (" + status + ")";
}

async function api(path, { method = "GET", json, form, formData, auth = true } = {}) {
  const headers = {};
  let body;
  if (json !== undefined) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(json);
  }
  if (form) body = new URLSearchParams(form);
  if (formData) body = formData;
  if (auth && state.token) headers["Authorization"] = "Bearer " + state.token;

  let res;
  try {
    res = await fetch(path, { method, headers, body });
  } catch (e) {
    throw new Error("Could not reach the server. It may be waking up, so try again in a moment.");
  }
  if (res.status === 204) return null;

  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }

  if (!res.ok) {
    if (res.status === 401 && auth && state.token) {
      signOut(false);
      sessionStorage.setItem("next", location.hash);
      go("#/login");
      throw new Error("Please sign in again.");
    }
    throw new Error(errorText(data, res.status));
  }
  return data;
}

// ---------- session ----------
async function loadMe() {
  if (!state.token) return;
  try {
    state.me = await api("/auth/me");
    const cart = await api("/cart");
    setCartCount(cart);
  } catch (e) {
    state.me = null;
  }
}

async function loadCategories() {
  try {
    state.categories = await api("/categories", { auth: false });
  } catch (e) {
    state.categories = [];
  }
}

function signOut(announce = true) {
  localStorage.removeItem("token");
  state.token = null;
  state.me = null;
  state.cartCount = 0;
  renderNav();
  if (announce) {
    toast("You are signed out. Come back soon!");
    go("#/home");
  }
}

function requireLogin() {
  if (state.me) return true;
  sessionStorage.setItem("next", location.hash);
  go("#/login");
  return false;
}

function setCartCount(cart) {
  state.cartCount = cart.items.reduce((n, i) => n + i.quantity, 0);
  renderNav();
}

// ---------- navigation ----------
function renderNav() {
  const page = location.hash.split("/")[1] || "home";
  const link = (target, text, pages = [target]) =>
    h("a", { href: "#/" + target, class: pages.includes(page) ? "active" : "" }, text);

  const items = [
    link("home", "Home"),
    link("shop", "Shop", ["shop", "category", "product"]),
    link("cart", "Cart" + (state.cartCount ? " (" + state.cartCount + ")" : "")),
    link("orders", "My orders", ["orders", "track", "checkout"]),
  ];
  if (state.me && state.me.is_admin) items.push(link("admin", "Admin"));
  if (state.me) {
    items.push(h("span", { class: "who" }, state.me.email));
    items.push(h("button", { class: "btn small", onclick: () => signOut() }, "Sign out"));
  } else {
    items.push(link("login", "Sign in"));
  }
  $nav.replaceChildren(...items);
}

async function render() {
  renderNav();
  const [, page = "home", arg] = location.hash.split("/");
  show(h("p", { class: "muted" }, "Loading…"));
  const views = {
    home: viewHome,
    shop: viewShop,
    category: viewShop,
    product: viewProduct,
    cart: viewCart,
    orders: viewOrders,
    track: viewTrack,
    checkout: viewCheckout,
    login: viewLogin,
    admin: viewAdmin,
  };
  try {
    await (views[page] || viewHome)(arg);
  } catch (e) {
    show(
      h("div", { class: "card" },
        h("p", {}, e.message),
        h("button", { class: "btn", onclick: render }, "Try again"))
    );
  }
  window.scrollTo(0, 0);
}

// ---------- shop ----------
const shopState = { q: "", sort: "newest", inStock: false };

const SORTS = {
  newest: (a, b) => b.id - a.id,
  price_asc: (a, b) => a.price - b.price,
  price_desc: (a, b) => b.price - a.price,
  rating: (a, b) => (b.rating_average || 0) - (a.rating_average || 0) || b.rating_count - a.rating_count,
};

function stars(value) {
  const filled = Math.max(0, Math.min(5, Math.round(value || 0)));
  return h("span", { class: "stars", role: "img", "aria-label": (value ? value.toFixed(1) : "No") + " out of 5 stars" },
    "★".repeat(filled), h("span", { class: "off" }, "★".repeat(5 - filled)));
}

function ratingLine(p) {
  return p.rating_count
    ? h("p", { class: "small rating" }, stars(p.rating_average), " " + p.rating_average.toFixed(1), h("span", { class: "muted" }, " (" + p.rating_count + ")"))
    : h("p", { class: "muted small" }, "No reviews yet");
}

// What the choices of a product are called: Size, Pack size ...
const optionLabel = (p) => (p.category && p.category.option_label) || "Size";

// "$4.00", or "From $3.00" when the sizes or packs are priced differently
function priceLabel(p) {
  const prices = (p.sizes || []).map((s) => (s.price != null ? s.price : p.price));
  if (!prices.length) return money(p.price);
  const lowest = Math.min(...prices);
  return lowest === Math.max(...prices) ? money(lowest) : "From " + money(lowest);
}

function optionText(s, p) {
  const own = s.price != null && s.price !== p.price ? " · " + money(s.price) : "";
  return s.label + own + (s.stock <= 0 ? " (sold out)" : "");
}

function greeting() {
  const hour = new Date().getHours();
  const part = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const name = firstName();
  return name ? part + ", " + name + "!" : part + "!";
}

// Use the first part of the email as a first name, but only when it looks like one
function firstName() {
  if (!state.me) return "";
  const local = state.me.email.split("@")[0];
  return /^[A-Za-z]{2,20}$/.test(local) ? local.charAt(0).toUpperCase() + local.slice(1).toLowerCase() : "";
}

async function viewShop(slug) {
  const products = await api("/products", { auth: false });

  if (slug && !category) {
    show(
      h("div", { class: "page-head" }, h("h1", {}, "We could not find that aisle"), h("p", { class: "muted" }, "It may have been renamed or removed.")),
      h("a", { class: "btn primary", href: "#/shop" }, "Browse everything")
    );
    return;
  }

  const chips = h("nav", { class: "cat-chips", "aria-label": "Categories" },
    h("a", { class: "cat-chip" + (category ? "" : " on"), href: "#/shop" }, "All"),
    state.categories.map((c) =>
      h("a", { class: "cat-chip" + (category && c.id === category.id ? " on" : ""), href: "#/category/" + c.slug }, c.icon + " " + c.name)));

    h("p", { class: "muted" }, category ? "Everything we have in " + category.name + "." : "Have a look around. We think you will find something you love."));

  const pool = category ? products.filter((p) => p.category && p.category.id === category.id) : products;
  if (!pool.length) {
    show(heading, chips, h("div", { class: "card" },
      h("p", {}, category ? "Nothing on this shelf yet. Please check back soon!" : "No products yet. Please check back soon!"),
      category ? h("a", { class: "btn", href: "#/shop" }, "See everything else") : null));
    return;
  }

  const search = h("input", { type: "search", placeholder: "Search products", value: shopState.q, "aria-label": "Search products" });
  const sort = h("select", { "aria-label": "Sort products" },
    [["newest", "Newest"], ["price_asc", "Price: low to high"], ["price_desc", "Price: high to low"], ["rating", "Top rated"]]
      .map(([value, text]) => h("option", { value, selected: value === shopState.sort }, text)));
  const stockOnly = h("input", { type: "checkbox", checked: shopState.inStock });
  const count = h("p", { class: "muted small" });
  const results = h("div", {});

  function draw() {
    const q = shopState.q.trim().toLowerCase();
    let list = pool.filter((p) => !q || (p.name + " " + (p.description || "")).toLowerCase().includes(q));
    if (shopState.inStock) list = list.filter((p) => p.stock > 0);
    list.sort(SORTS[shopState.sort] || SORTS.newest);
    count.replaceChildren(document.createTextNode(list.length + (list.length === 1 ? " product" : " products")));
    results.replaceChildren(
      list.length
        ? h("div", { class: "grid" }, list.map(productCard))
        : h("p", { class: "muted" }, "We could not find anything for that. Try another word, or clear the filters."));
  }

  search.addEventListener("input", () => { shopState.q = search.value; draw(); });
  sort.addEventListener("change", () => { shopState.sort = sort.value; draw(); });
  stockOnly.addEventListener("change", () => { shopState.inStock = stockOnly.checked; draw(); });

  show(
    heading,
    chips,
    h("div", { class: "card controls" }, search, sort,
      h("label", { class: "check" }, stockOnly, "In stock only")),
    count,
    results
  );
  draw();

async function addToCart(product, button, size, quantity = 1) {
  if (!requireLogin()) return;
  if ((product.sizes || []).length && !size) {
    toast("Please choose a " + optionLabel(product).toLowerCase() + " first.", "error");

  }

      method: "POST",

function gallery(product) {
  const images = product.images || [];
  if (!images.length) {
    return h("div", { class: "tile big", "aria-hidden": "true" }, (product.name || "?").trim().charAt(0).toUpperCase());
  }
  let index = 0;
  const main = h("img", { class: "photo big", src: images[0].url, alt: product.name, tabindex: "0", title: "Click to enlarge" });
  const thumbs = images.map((image, i) =>
    h("img", {
      class: "thumb pick" + (i === 0 ? " on" : ""), src: image.url,
      alt: "Photo " + (i + 1) + " of " + product.name, onclick: () => select(i),
    }));

  function select(i) {
    index = i;
    main.setAttribute("src", images[i].url);
    thumbs.forEach((t, j) => { t.className = "thumb pick" + (j === i ? " on" : ""); });
  }

  main.addEventListener("click", () => openLightbox(images, index, product.name));
  main.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(images, index, product.name); }
  });
  return h("div", {}, main, images.length > 1 ? h("div", { class: "thumbs" }, thumbs) : null);
}

// Full-screen viewer: arrows or arrow keys to browse, click the photo to zoom, Esc to close.
function openLightbox(images, start, title) {
  let index = start;
  const img = h("img", { class: "lb-img", alt: title });
  const counter = h("div", { class: "lb-count" });
  const overlay = h("div", { class: "lightbox", role: "dialog", "aria-modal": "true", "aria-label": title + " photos" });

  function showPhoto(i) {
    index = (i + images.length) % images.length;
    img.setAttribute("src", images[index].url);
    img.className = "lb-img";
    img.style.transformOrigin = "";
    counter.replaceChildren(document.createTextNode(images.length > 1 ? (index + 1) + " / " + images.length : ""));
  }
  function close() {
    overlay.remove();
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e) {
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight" && images.length > 1) showPhoto(index + 1);
    else if (e.key === "ArrowLeft" && images.length > 1) showPhoto(index - 1);
  }

  img.addEventListener("click", (e) => {
    e.stopPropagation();
    if (img.className.includes("zoomed")) {
      img.className = "lb-img";
      img.style.transformOrigin = "";
    } else {
      const box = img.getBoundingClientRect();
      img.style.transformOrigin = ((e.clientX - box.left) / box.width * 100) + "% " + ((e.clientY - box.top) / box.height * 100) + "%";
      img.className = "lb-img zoomed";
    }
  });
  overlay.addEventListener("click", close);

  overlay.append(
    img,
    counter,
    h("button", { class: "lb-btn lb-close", "aria-label": "Close", onclick: (e) => { e.stopPropagation(); close(); } }, "×"),
    images.length > 1 ? h("button", { class: "lb-btn lb-prev", "aria-label": "Previous photo", onclick: (e) => { e.stopPropagation(); showPhoto(index - 1); } }, "‹") : null,
    images.length > 1 ? h("button", { class: "lb-btn lb-next", "aria-label": "Next photo", onclick: (e) => { e.stopPropagation(); showPhoto(index + 1); } }, "›") : null
  );
  showPhoto(index);
  document.addEventListener("keydown", onKey);
  document.body.append(overlay);
}

function reviewForm(product, existing) {
  let rating = existing ? existing.rating : 0;
  const picker = h("div", { class: "star-picker", role: "group", "aria-label": "Your rating" });
  function drawStars() {
    picker.replaceChildren(...[1, 2, 3, 4, 5].map((n) =>
      h("button", {
        type: "button", class: "star-btn" + (n <= rating ? " on" : ""),
        "aria-label": "Rate " + n + (n === 1 ? " star" : " stars"), "aria-pressed": String(n === rating),
        onclick: () => { rating = n; drawStars(); },
      }, "★")));
  }
  drawStars();

  const comment = h("textarea", { rows: "3", maxlength: "1000", placeholder: "Share what you liked or did not like (optional)", "aria-label": "Your review" }, existing ? existing.comment : "");
  const submit = h("button", { class: "btn primary", type: "submit" }, existing ? "Update review" : "Post review");
  const remove = existing
    ? h("button", { class: "btn ghost", type: "button", onclick: async () => {
        try {
          await api("/products/" + product.id + "/reviews/mine", { method: "DELETE" });
          toast("Your review was deleted.", "ok");
          render();
        } catch (e) {
          toast(e.message, "error");
        }
      } }, "Delete my review")
    : null;

  return h("form", { class: "form", onsubmit: async (event) => {
    event.preventDefault();
    if (!rating) { toast("Choose a star rating first.", "error"); return; }
    submit.disabled = true;
    try {
      await api("/products/" + product.id + "/reviews", { method: "PUT", json: { rating, comment: comment.value.trim() } });
      toast("Thank you for your review!", "ok");
      render();
    } catch (e) {
      toast(e.message, "error");
      submit.disabled = false;
    }
  } }, picker, comment, h("div", { class: "actions" }, submit, remove));
}

const ADDRESS_FIELDS = [
  ["recipient_name", "Full name", "name"],
  ["phone", "Phone", "tel"],
  ["address_line1", "Address line 1", "address-line1"],
  ["address_line2", "Address line 2 (optional)", "address-line2"],

  ["postal_code", "Postal code", "postal-code"],

function addressForm(address, buttonText, onSubmit) {
  const inputs = {};
  const fields = ADDRESS_FIELDS.map(([key, text, autocomplete]) => {
    const input = h("input", {
      id: "f_" + key,
      name: key,
      autocomplete,
      value: address && address[key] ? address[key] : "",
      required: key !== "address_line2",

    return h("label", { class: "field", for: "f_" + key }, h("span", {}, text), input);

    const data = {};

    }

    try {

    } catch (e) {
      toast(e.message, "error");

      submit.disabled = false;

  const index = STEPS.indexOf(deliveryStatus);
  return index === -1 ? 0 : index;
}

    ? h("div", { class: "card" },

    h("h1", {}, "Order #" + d.order_id),

// "S:10, M:5" or "1 kg:10:75" (name:stock or name:stock:price)
// -> [{ label: "S", stock: 10 }, { label: "1 kg", stock: 10, price: 75 }]
function parseSizes(text) {
  const result = [];
  for (const part of text.split(",")) {
    const bit = part.trim();
    if (!bit) continue;
    const [label, stock, price] = bit.split(":").map((x) => x.trim());
    const count = stock === undefined || stock === "" ? 0 : Number(stock);
    const cost = price === undefined || price === "" ? null : Number(price);
    if (!label || !Number.isInteger(count) || count < 0 || (cost !== null && (!Number.isFinite(cost) || cost < 0))) {
      throw new Error('Could not read "' + bit + '". Write options like S:10, M:5 or, with a price, 1 kg:10:75');
    }
    result.push(cost === null ? { label, stock: count } : { label, stock: count, price: cost });
  }
  return result;
}

const sizesText = (p) =>
  (p.sizes || []).map((s) => s.label + ":" + s.stock + (s.price != null ? ":" + s.price : "")).join(", ");

// Phone photos are big, so shrink them in the browser before uploading.
async function shrinkImage(file) {
  try {
    if (!file.type.startsWith("image/")) return file;
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 1200 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const context = canvas.getContext("2d");
    context.fillStyle = "#ffffff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
    return blob || file;
  } catch (e) {
    return file;
  }
}

async function uploadPhoto(productId, file) {
  const blob = await shrinkImage(file);
  const data = new FormData();
  data.append("file", blob, "product.jpg");
  return api("/products/" + productId + "/photos", { method: "POST", formData: data });
}

async function uploadPhotos(productId, files) {
  let done = 0;
  for (const file of Array.from(files)) {
    await uploadPhoto(productId, file);
    done += 1;
  }
  return done;
}

function adminOrderCard(order) {
  const panel = h("div", {});
  const actions = [];

  const refresh = () => render();

  if (order.status === "paid" && order.delivery_status === "processing") {
    actions.push(h("button", { class: "btn primary small", onclick: () => panel.replaceChildren(shipForm(order, refresh)) }, "Ship order"));
  } else if (order.status === "paid" && order.delivery_status === "awaiting_address") {
    actions.push(h("span", { class: "muted small" }, "Waiting for the customer's delivery address."));
  } else if (["shipped"].includes(order.status)) {
    actions.push(h("button", { class: "btn primary small", onclick: () => panel.replaceChildren(trackingForm(order, refresh)) }, "Add tracking update"));
  }
  actions.push(h("button", { class: "btn small", onclick: async () => {
    try {
      const d = await api("/orders/" + order.id + "/delivery");
      panel.replaceChildren(h("div", { class: "cols" },
        h("div", {}, h("h3", {}, "Delivering to"), d.address ? addressLines(d.address) : h("p", { class: "muted" }, "No address yet.")),
        h("div", {}, h("h3", {}, "History"),
          h("ul", { class: "timeline" }, d.timeline.slice().reverse().map((e) =>
            h("li", {}, h("strong", {}, label(e.status)), e.location ? " · " + e.location : "", h("div", { class: "muted small" }, when(e.created_at))))))));
    } catch (e) {
      toast(e.message, "error");
    }
  } }, "Delivery details"));

  return h("div", { class: "card" },
    h("div", { class: "order-head" },
      h("strong", {}, "Order #" + order.id),
      badge(order.status),
      badge(order.delivery_status),
      h("span", { class: "muted small" }, (order.user_email || "unknown customer") + " · " + when(order.created_at)),
      h("span", { class: "grow" }),
      h("strong", {}, money(order.total))),
    h("div", { class: "actions" }, actions),
    panel);
}

function shipForm(order, done) {
  const carrier = h("input", { placeholder: "Carrier", required: true, "aria-label": "Carrier" });
  const number = h("input", { placeholder: "Tracking number", required: true, minlength: "3", "aria-label": "Tracking number" });
  const url = h("input", { type: "url", placeholder: "Tracking link (optional)", "aria-label": "Tracking link" });
  const place = h("input", { placeholder: "Location (optional)", "aria-label": "Location" });
  return h("form", { class: "inline-form", onsubmit: async (event) => {
    event.preventDefault();
    const body = { carrier: carrier.value.trim(), tracking_number: number.value.trim() };
    if (url.value.trim()) body.tracking_url = url.value.trim();
    if (place.value.trim()) body.location = place.value.trim();
    try {
      await api("/admin/orders/" + order.id + "/ship", { method: "POST", json: body });
      toast("Order #" + order.id + " marked as shipped.", "ok");
      done();
    } catch (e) {
      toast(e.message, "error");
    }
  } }, carrier, number, url, place, h("button", { class: "btn primary", type: "submit" }, "Mark as shipped"));
}

function trackingForm(order, done) {
  const status = h("select", { "aria-label": "New status" },
    [["in_transit", "In transit"], ["out_for_delivery", "Out for delivery"], ["delivered", "Delivered"]]
      .map(([value, text]) => h("option", { value }, text)));
  const place = h("input", { placeholder: "Location (optional)", "aria-label": "Location" });
  const note = h("input", { placeholder: "Note (optional)", "aria-label": "Note" });
  return h("form", { class: "inline-form", onsubmit: async (event) => {
    event.preventDefault();
    const body = { status: status.value };
    if (place.value.trim()) body.location = place.value.trim();
    if (note.value.trim()) body.note = note.value.trim();
    try {
      await api("/admin/orders/" + order.id + "/tracking", { method: "POST", json: body });
      toast("Tracking updated.", "ok");
      done();
    } catch (e) {
      toast(e.message, "error");
    }
  } }, status, place, note, h("button", { class: "btn primary", type: "submit" }, "Add update"));
}

// ---------- start ----------
function applyBranding() {
  document.title = STORE_NAME;
  const name = document.getElementById("brand-name");
  if (name) name.replaceChildren(document.createTextNode(STORE_NAME));
  const foot = document.getElementById("foot");
  if (foot) foot.replaceChildren(h("p", {}, "⚡ " + STORE_NAME + " · Made with care · Secure checkout powered by Stripe"));
}

async function start() {
  applyBranding();
  const params = new URLSearchParams(location.search);
  const paid = params.get("paid");
  const cancelled = params.get("cancelled");
  if (paid || cancelled) {
    history.replaceState(null, "", location.pathname + "#/orders");
  } else if (!location.hash) {
    history.replaceState(null, "", location.pathname + "#/home");
  }

  await loadMe();
  await loadCategories();
  if (paid) {
    state.poll = 5;
    toast("Thank you! Your payment was received. Your order will update in a few seconds.", "ok");
  }
  if (cancelled) toast("Payment cancelled. Your order is held for a short time.");
  render();
}

window.addEventListener("hashchange", render);
start();
</script>
